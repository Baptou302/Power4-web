<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord Admin - Power4 Web</title>
    <link rel="stylesheet" href="/assets/style/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #333;
        }
        
        .admin-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            margin: 40px auto;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        
        .form-group {
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .form-title {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #555;
            font-weight: 600;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        input[type="text"],
        input[type="password"],
        select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button, .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        button:hover, .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        a.btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4) !important;
        }
        
        .btn-danger {
            background: #ff3b3b;
        }
        
        .btn-danger:hover {
            background: #e02f2f;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover {
            background-color: #f8f9fa;
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .no-users {
            text-align: center;
            padding: 30px;
            color: #666;
            font-style: italic;
        }
        
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .logout-btn {
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .logout-btn:hover {
            background: #e02f2f;
            transform: translateY(-2px);
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="/mode-selection" class="back-btn">← Retour</a>
    <div class="top-buttons">
        <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>
    
    <div class="admin-container">
        <h1>Tableau de bord Administrateur</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <a href="/admin/tickets" class="btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 25px; text-align: center; font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); transition: all 0.3s ease;">
                <span style="font-size: 3rem;">🎫</span>
                <span style="font-weight: 600;">Gérer les tickets</span>
                <span style="font-size: 0.9rem; opacity: 0.9;">Support client</span>
            </a>
        </div>
        
        <div class="form-group">
            <h2 class="form-title">Ajouter un nouvel utilisateur</h2>
            <form method="post" class="form-row">
                <input type="hidden" name="action" value="add">
                <input type="text" name="username" placeholder="Pseudo" required>
                <input type="password" name="password" placeholder="Mot de passe" required>
                <select name="role" required>
                    <option value="" disabled selected>Sélectionner un rôle</option>
                    <option value="user">Utilisateur</option>
                    <option value="admin">Administrateur</option>
                </select>
                <button type="submit" class="btn">Créer</button>
            </form>
        </div>
        
        <div class="form-group">
            <h2 class="form-title">Gestion des utilisateurs</h2>
            {{if .Users}}
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pseudo</th>
                            <th>Rôle</th>
                            <th>XP</th>
                            <th>Niveau</th>
                            <th>Titre</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Users}}
                        <tr>
                            <form method="post">
                                <input type="hidden" name="id" value="{{.ID}}">
                                <td>{{.ID}}</td>
                                <td><input type="text" name="username" value="{{.Username}}" style="width: 100%; box-sizing: border-box;"></td>
                                <td>
                                    <select name="role" style="width: 100%;">
                                        <option value="user" {{if eq .Role "user"}}selected{{end}}>Utilisateur</option>
                                        <option value="admin" {{if eq .Role "admin"}}selected{{end}}>Administrateur</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" name="xp" value="{{.XP}}" min="0" max="100" style="width: 80px; box-sizing: border-box; padding: 8px; border: 2px solid #e0e0e0; border-radius: 6px;">
                                </td>
                                <td style="text-align: center; font-weight: 600; color: #667eea;">{{.Level}}</td>
                                <td style="font-weight: 500; color: #764ba2;">{{.Title}}</td>
                                <td class="action-buttons">
                                    <button type="submit" name="action" value="edit" class="btn btn-secondary">Mettre à jour</button>
                                    <button type="submit" name="action" value="update_xp" class="btn" style="background: #667eea;">Mettre à jour XP</button>
                                    <button type="submit" name="action" value="delete" class="btn btn-danger" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')">Supprimer</button>
                                </td>
                            </form>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{else}}
            <p class="no-users">Aucun utilisateur trouvé</p>
            {{end}}
        </div>
    </div>
    
    <script>
        // Gestion de la déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                if (response.ok) {
                    window.location.href = '/login';
                } else {
                    console.error('Erreur lors de la déconnexion');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Erreur:', error);
                window.location.href = '/login';
            }
        });
    </script>
</body>
</html>
